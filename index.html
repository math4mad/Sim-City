<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Sim City — three.js × Polyfork</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1017; }
    canvas { display: block; }

    #ui {
      position: absolute; top: 16px; left: 16px;
      display: flex; flex-wrap: wrap; gap: 6px;
      max-width: 720px; padding: 10px;
      background: rgba(13, 16, 23, 0.82); border-radius: 12px;
      backdrop-filter: blur(6px);
      user-select: none;
    }
    #ui button {
      font: 12px/1 -apple-system, "Segoe UI", sans-serif;
      color: #e8eaf0; background: #232a38; border: 1px solid #38455c;
      padding: 8px 10px; border-radius: 8px; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    #ui button:hover { background: #2e384d; }
    #ui button.active { background: #3a86ff; border-color: #6ea8ff; }
    #hint {
      position: absolute; bottom: 14px; left: 16px;
      font: 12px/1.5 -apple-system, "Segoe UI", sans-serif; color: #9aa4b5;
      background: rgba(13,16,23,.82); padding: 8px 12px; border-radius: 8px;
    }
    #status {
      position: absolute; top: 16px; right: 16px;
      font: 12px/1.5 -apple-system, "Segoe UI", sans-serif; color: #9aa4b5;
      background: rgba(13,16,23,.82); padding: 8px 12px; border-radius: 8px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ui"></div>
  <div id="hint">左键放置 · R 旋转 · 右键/bulldozer 移除 · 滚轮缩放 · 拖拽旋转视角</div>
  <div id="status">加载资源中…</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
